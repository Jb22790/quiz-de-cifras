<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1530">
<title>Quadradinhos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/quadradinhos.css">
</head>
<body>
<main class="qd">
  <div class="top">
    <a class="ico" href="./" aria-label="Voltar">←</a>
    <h1>Quadradinhos</h1>
    <div class="nops" role="group" aria-label="Número de opções">
      <button data-opcoes="2">2</button>
      <button data-opcoes="3">3</button>
      <button data-opcoes="4">4</button>
    </div>
  </div>

  <div class="chips" role="group" aria-label="Sequências">
    <button class="chip" data-filtro="maior">Maiores</button>
    <button class="chip" data-filtro="menor">Menores</button>
    <button class="chip" data-filtro="todas">Todas</button>
    <button class="chip estudar" id="btn-estudar" aria-label="Estudar: ver todas as sequências">📖</button>
  </div>

  <div class="prog"><i id="prog"></i></div>
  <div class="meta">
    <span id="passo">acorde 2 de 4</span>
    <span class="placar"><span>✅ <b id="acertos">0</b></span><span>❌ <b id="erros">0</b></span><span>🔥 <b id="streak">0</b></span></span>
  </div>

  <span class="pill" id="titulo-sequencia"></span>
  <div class="seq" id="sequencia"></div>

  <p class="ask" id="pergunta"></p>
  <div class="opts" id="opcoes"></div>
  <div id="fim" hidden>
    <p class="fim" id="fim-texto"></p>
    <button class="btn" id="btn-proxima">Próxima sequência →</button>
  </div>
</main>
<script src="js/quadradinhos/dados.js"></script>
<script src="js/quadradinhos/motor.js"></script>
<script src="js/quadradinhos/jogo.js"></script>
</body>
</html>
